<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Sugar Corner'">Sugar Corner</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="header">
        <div class="container">
            <a th:href="@{/}" class="logo">Sugar Corner</a>
            <nav class="nav">
                <a th:href="@{/}">Home</a>
                <a th:href="@{/products}">Products</a>
                <a th:href="@{/cart}">Cart</a>
                <a th:href="@{/feedback}">Feedback</a>
                <div sec:authorize="isAuthenticated()">
                    <a th:href="@{/orders}">My Orders</a>
                    <a th:href="@{/profile}">Profile</a>
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/products}">Admin</a>
                    <form th:action="@{/logout}" method="post" class="inline-form">
                        <button type="submit">Logout</button>
                    </form>
                </div>
                <div sec:authorize="!isAuthenticated()">
                    <a th:href="@{/login}">Login</a>
                    <a th:href="@{/auth/register}">Register</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="main">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
        <div th:replace="~{${content}}"></div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Sugar Corner - Brownies Sales & Order Management</p>
        </div>
    </footer>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
