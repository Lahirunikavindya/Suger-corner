<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Sugar Corner</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="header">
        <div class="container">
            <a th:href="@{/}" class="logo">Sugar Corner</a>
            <nav class="nav">
                <a th:href="@{/}">Home</a>
                <a th:href="@{/products}">Products</a>
                <a th:href="@{/cart}">Cart</a>
                <a th:href="@{/feedback}">Feedback</a>
                <div sec:authorize="isAuthenticated()">
                    <a th:href="@{/orders}">My Orders</a>
                    <a th:href="@{/profile}">Profile</a>
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/products}">Admin</a>
                    <form th:action="@{/logout}" method="post" class="inline-form">
                        <button type="submit">Logout</button>
                    </form>
                </div>
                <div sec:authorize="!isAuthenticated()">
                    <a th:href="@{/login}">Login</a>
                    <a th:href="@{/auth/register}">Register</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <h1>Our Brownies</h1>
            <form th:action="@{/products}" method="get" class="search-form">
                <input type="text" name="search" th:value="${search}" placeholder="Search products...">
                <button type="submit" class="btn btn-primary">Search</button>
            </form>

            <div class="product-grid" th:if="${!products.isEmpty()}">
                <div class="product-card" th:each="product : ${products}">
                    <img th:src="${(product.imageUrl != null and !product.imageUrl.isEmpty()) ? product.imageUrl : '/images/placeholder.svg'}" alt="Product" class="product-img">
                    <h3 th:text="${product.name}">Product Name</h3>
                    <p th:text="${product.description}" class="product-desc">Description</p>
                    <p class="price" th:text="'${' + product.price + '}'">$0.00</p>
                    <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-secondary">View Details</a>
                    <form sec:authorize="isAuthenticated()" th:action="@{/cart/add}" method="post" class="inline-form">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <input type="hidden" name="quantity" value="1">
                        <button type="submit" class="btn btn-primary">Add to Cart</button>
                    </form>
                </div>
            </div>
            <p th:if="${products.isEmpty()}" class="empty">No products found.</p>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Sugar Corner</p>
        </div>
    </footer>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
