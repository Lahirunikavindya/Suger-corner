<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us - Sugar Corner</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body class="home-page">
    <header class="welcome-nav">
        <div class="nav-container">
            <a th:href="@{/}" class="nav-logo">Sugar Corner 🍰</a>
            <nav class="nav-links">
                <a th:href="@{/}">Home</a>
                <a th:href="@{/products}">Shop</a>
                <a th:href="@{/about}">About Us</a>
                <a th:href="@{/contact}">Contact</a>
                <div sec:authorize="isAuthenticated()">
                    <a th:href="@{/orders}">My Orders</a>
                    <a th:href="@{/profile}">Profile</a>
                    <form th:action="@{/logout}" method="post" class="nav-form">
                        <button type="submit" class="nav-btn">Logout</button>
                    </form>
                </div>
                <div sec:authorize="!isAuthenticated()">
                    <a th:href="@{/login}">Login</a>
                    <a th:href="@{/auth/register}">Register</a>
                </div>
            </nav>
        </div>
    </header>

    <main style="padding-top: 80px; padding-bottom: 4rem;">
        <div class="container" style="max-width: 800px; margin: 0 auto; padding: 2rem;">
            <h1 style="font-family: 'Playfair Display', serif; color: var(--chocolate-dark);">About Sugar Corner</h1>
            <p>We're passionate about bringing you the finest handcrafted brownies, baked fresh with love and premium ingredients.</p>
            <p><a th:href="@{/}">← Back to Home</a></p>
        </div>
    </main>
</body>
</html>
