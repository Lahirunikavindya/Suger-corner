<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Sugar Corner</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="header">
        <div class="container">
            <a th:href="@{/}" class="logo">Sugar Corner</a>
            <nav class="nav">
                <a th:href="@{/}">Home</a>
                <a th:href="@{/products}">Products</a>
                <a th:href="@{/cart}">Cart</a>
                <div sec:authorize="isAuthenticated()">
                    <a th:href="@{/orders}">My Orders</a>
                    <a th:href="@{/profile}">Profile</a>
                    <form th:action="@{/logout}" method="post" class="inline-form">
                        <button type="submit">Logout</button>
                    </form>
                </div>
                <div sec:authorize="!isAuthenticated()">
                    <a th:href="@{/login}">Login</a>
                    <a th:href="@{/auth/register}">Register</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <h1>Your Cart</h1>
            <div sec:authorize="!isAuthenticated()">
                <p>Please <a th:href="@{/login}">login</a> to place an order.</p>
            </div>
            <div sec:authorize="isAuthenticated()">
                <div th:if="${cartItems.isEmpty()}" class="empty">
                    <p>Your cart is empty. <a th:href="@{/products}">Browse products</a> to add items.</p>
                </div>
                <div th:if="${!cartItems.isEmpty()}">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Subtotal</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${cartItems}">
                                <td th:text="${item.product().name}">Product</td>
                                <td th:text="${'$' + item.product().price}">$0.00</td>
                                <td th:text="${item.quantity()}">1</td>
                                <td th:text="${'$' + item.subtotal()}">$0.00</td>
                                <td>
                                    <form th:action="@{/cart/remove/{id}(id=${item.product().id})}" method="post" class="inline-form">
                                        <button type="submit" class="btn btn-sm btn-danger">Remove</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <p class="total">Total: <strong th:text="${'$' + cartTotal}">$0.00</strong></p>

                    <form th:action="@{/orders}" th:object="${orderRequest}" method="post" class="form">
                        <th:block th:each="item, iterStat : *{items}">
                            <input type="hidden" th:name="items[__${iterStat.index}__].productId" th:value="${item.productId()}">
                            <input type="hidden" th:name="items[__${iterStat.index}__].quantity" th:value="${item.quantity()}">
                        </th:block>
                        <div class="form-group">
                            <label for="deliveryAddress">Delivery Address</label>
                            <textarea id="deliveryAddress" th:field="*{deliveryAddress}" rows="3" required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="notes">Order Notes</label>
                            <textarea id="notes" th:field="*{notes}" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Place Order (Cash on Delivery)</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Sugar Corner</p>
        </div>
    </footer>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
