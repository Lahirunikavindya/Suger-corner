<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - Sugar Corner Admin</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="header">
        <div class="container">
            <a th:href="@{/}" class="logo">Sugar Corner</a>
            <nav class="nav admin-nav">
                <a th:href="@{/admin/products}">Products</a>
                <a th:href="@{/admin/orders}">Orders</a>
                <a th:href="@{/admin/payments}">Payments</a>
                <a th:href="@{/admin/feedback}">Feedback</a>
                <a th:href="@{/}">Store</a>
                <form th:action="@{/logout}" method="post" class="inline-form">
                    <button type="submit">Logout</button>
                </form>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <h1>Manage Products</h1>
            <a th:href="@{/admin/products/new}" class="btn btn-primary">Add Product</a>
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}">
                        <td th:text="${product.id}">1</td>
                        <td th:text="${product.name}">Product</td>
                        <td th:text="${'$' + product.price}">$0.00</td>
                        <td th:text="${product.stockQuantity}">0</td>
                        <td><span th:text="${product.active ? 'Active' : 'Inactive'}"></span></td>
                        <td>
                            <a th:href="@{/admin/products/{id}/edit(id=${product.id})}" class="btn btn-sm">Edit</a>
                            <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post" class="inline-form">
                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Delete this product?')">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Sugar Corner Admin</p>
        </div>
    </footer>
</body>
</html>
