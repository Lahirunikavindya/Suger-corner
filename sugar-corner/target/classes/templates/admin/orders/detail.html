<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Order ' + ${order.orderNumber} + ' - Admin'">Order - Sugar Corner Admin</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="header">
        <div class="container">
            <a th:href="@{/}" class="logo">Sugar Corner</a>
            <nav class="nav admin-nav">
                <a th:href="@{/admin/products}">Products</a>
                <a th:href="@{/admin/orders}">Orders</a>
                <a th:href="@{/admin/payments}">Payments</a>
                <a th:href="@{/admin/feedback}">Feedback</a>
                <a th:href="@{/}">Store</a>
                <form th:action="@{/logout}" method="post" class="inline-form">
                    <button type="submit">Logout</button>
                </form>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <a th:href="@{/admin/orders}" class="back-link">&larr; Back to Orders</a>
            <h1>Order <span th:text="${order.orderNumber}"></span></h1>
            <p>Customer: <span th:text="${order.customer.fullName}"></span> (<span th:text="${order.customer.email}"></span>)</p>
            <p>Date: <span th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}"></span></p>
            <p>Delivery Address: <span th:text="${order.deliveryAddress}"></span></p>

            <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" class="status-form">
                <label for="status">Update Status:</label>
                <select name="status" id="status">
                    <option th:each="s : ${T(com.sugarcorner.model.entity.Order$OrderStatus).values()}"
                            th:value="${s}" th:text="${s}"
                            th:selected="${s == order.status}"></option>
                </select>
                <button type="submit" class="btn btn-primary">Update</button>
            </form>

            <h2>Order Items</h2>
            <table class="table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Unit Price</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${order.orderItems}">
                        <td th:text="${item.product.name}">Product</td>
                        <td th:text="${item.quantity}">1</td>
                        <td th:text="${'$' + item.unitPrice}">$0.00</td>
                        <td th:text="${'$' + item.subtotal}">$0.00</td>
                    </tr>
                </tbody>
            </table>
            <p class="total"><strong>Total: <span th:text="${'$' + order.totalAmount}"></span></strong></p>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Sugar Corner Admin</p>
        </div>
    </footer>
</body>
</html>
