<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Sugar Corner</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="header">
        <div class="container">
            <a th:href="@{/}" class="logo">Sugar Corner</a>
            <nav class="nav">
                <a th:href="@{/}">Home</a>
                <a th:href="@{/products}">Products</a>
                <a th:href="@{/feedback}">Feedback</a>
                <div sec:authorize="isAuthenticated()">
                    <a th:href="@{/feedback/history}">My Feedback</a>
                    <a th:href="@{/profile}">Profile</a>
                    <form th:action="@{/logout}" method="post" class="inline-form">
                        <button type="submit">Logout</button>
                    </form>
                </div>
                <div sec:authorize="!isAuthenticated()">
                    <a th:href="@{/login}">Login</a>
                    <a th:href="@{/auth/register}">Register</a>
                </div>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <h1>Send Feedback</h1>
            <form th:action="@{/feedback}" th:object="${feedbackRequest}" method="post" class="form">
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" th:field="*{subject}" required placeholder="Brief subject">
                    <span th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}" class="error"></span>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" th:field="*{message}" rows="5" required placeholder="Your feedback or inquiry..."></textarea>
                    <span th:if="${#fields.hasErrors('message')}" th:errors="*{message}" class="error"></span>
                </div>
                <button type="submit" class="btn btn-primary">Submit Feedback</button>
            </form>
            <p sec:authorize="isAuthenticated()">View your <a th:href="@{/feedback/history}">feedback history</a>.</p>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Sugar Corner</p>
        </div>
    </footer>
</body>
</html>
