<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Feedback - Sugar Corner Admin</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="header">
        <div class="container">
            <a th:href="@{/}" class="logo">Sugar Corner</a>
            <nav class="nav admin-nav">
                <a th:href="@{/admin/products}">Products</a>
                <a th:href="@{/admin/orders}">Orders</a>
                <a th:href="@{/admin/payments}">Payments</a>
                <a th:href="@{/admin/feedback}">Feedback</a>
                <a th:href="@{/}">Store</a>
                <form th:action="@{/logout}" method="post" class="inline-form">
                    <button type="submit">Logout</button>
                </form>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <h1>Manage Feedback</h1>
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Customer</th>
                        <th>Subject</th>
                        <th>Submitted</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="fb : ${feedbacks}">
                        <td th:text="${fb.id}">1</td>
                        <td th:text="${fb.customer.fullName}">Customer</td>
                        <td th:text="${fb.subject}">Subject</td>
                        <td th:text="${#temporals.format(fb.submittedAt, 'yyyy-MM-dd HH:mm')}">2025-01-01</td>
                        <td><span class="badge" th:text="${fb.status}"></span></td>
                        <td><a th:href="@{/admin/feedback/{id}(id=${fb.id})}" class="btn btn-sm">View</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Sugar Corner Admin</p>
        </div>
    </footer>
</body>
</html>
