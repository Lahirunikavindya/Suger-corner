<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Sugar Corner</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="header">
        <div class="container">
            <a th:href="@{/}" class="logo">Sugar Corner</a>
            <nav class="nav">
                <a th:href="@{/}">Home</a>
                <a th:href="@{/products}">Products</a>
                <a th:href="@{/orders}">My Orders</a>
                <a th:href="@{/profile}">Profile</a>
                <form th:action="@{/logout}" method="post" class="inline-form">
                    <button type="submit">Logout</button>
                </form>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <h1>My Profile</h1>
            <form th:action="@{/profile/update}" th:object="${profileUpdateRequest}" method="post" class="form">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" th:field="*{firstName}" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" th:field="*{lastName}" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" th:field="*{phone}" required>
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" th:field="*{address}" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Update Profile</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Sugar Corner</p>
        </div>
    </footer>
</body>
</html>
