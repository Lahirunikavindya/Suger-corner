<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sugar Corner</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="header">
        <div class="container">
            <a th:href="@{/}" class="logo">Sugar Corner</a>
            <nav class="nav">
                <a th:href="@{/}">Home</a>
                <a th:href="@{/products}">Products</a>
                <a th:href="@{/auth/register}">Register</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="auth-card">
                <h1>Login</h1>
                <div th:if="${param.error}" class="alert alert-error">Invalid email or password.</div>
                <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

                <form th:action="@{/login}" method="post" class="form">
                    <div class="form-group">
                        <label for="username">Email</label>
                        <input type="email" id="username" name="username" required autofocus>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                <p>Don't have an account? <a th:href="@{/auth/register}">Register</a></p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Sugar Corner</p>
        </div>
    </footer>
</body>
</html>
