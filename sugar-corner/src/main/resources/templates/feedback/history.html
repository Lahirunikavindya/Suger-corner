<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback History - Sugar Corner</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header class="header">
        <div class="container">
            <a th:href="@{/}" class="logo">Sugar Corner</a>
            <nav class="nav">
                <a th:href="@{/}">Home</a>
                <a th:href="@{/feedback}">Feedback</a>
                <a th:href="@{/profile}">Profile</a>
                <form th:action="@{/logout}" method="post" class="inline-form">
                    <button type="submit">Logout</button>
                </form>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <h1>My Feedback</h1>
            <div th:if="${feedbacks.isEmpty()}" class="empty">
                <p>You haven't submitted any feedback yet. <a th:href="@{/feedback}">Submit feedback</a></p>
            </div>
            <div th:if="${!feedbacks.isEmpty()}" class="feedback-list">
                <div class="feedback-card" th:each="fb : ${feedbacks}">
                    <h3 th:text="${fb.subject}">Subject</h3>
                    <p th:text="${fb.message}">Message</p>
                    <p class="meta">Submitted: <span th:text="${#temporals.format(fb.submittedAt, 'yyyy-MM-dd HH:mm')}"></span></p>
                    <p class="meta">Status: <span class="badge" th:text="${fb.status}"></span></p>
                    <div th:if="${fb.adminResponse}">
                        <p><strong>Admin Response:</strong> <span th:text="${fb.adminResponse}"></span></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Sugar Corner</p>
        </div>
    </footer>
</body>
</html>
