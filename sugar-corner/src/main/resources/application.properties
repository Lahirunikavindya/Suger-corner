# ===========================================
# Sugar Corner - Application Configuration
# ===========================================

# Application Name
spring.application.name=Sugar Corner

# Server Configuration
server.port=8080
server.servlet.context-path=/

# ===========================================
# Database Configuration
# Default: H2 (works without MySQL)
# For MySQL: set spring.profiles.active=mysql
# ===========================================
spring.datasource.url=jdbc:h2:mem:sugarcorner;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ===========================================
# JPA / Hibernate Configuration
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# ===========================================
# Thymeleaf Configuration
# ===========================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===========================================
# Static Resources
# ===========================================
spring.web.resources.static-locations=classpath:/static/

# ===========================================
# Logging Configuration
# ===========================================
logging.level.root=INFO
logging.level.com.sugarcorner=DEBUG
logging.level.org.springframework.security=DEBUG
