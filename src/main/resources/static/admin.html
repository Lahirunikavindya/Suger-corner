<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Contact & Inquiry Management</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-page">
        <header class="admin-header">
            <h1>Admin Dashboard</h1>
            <a href="/">← Back to Contact Form</a>
        </header>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-value" id="totalCount">-</div>
                <div class="stat-label">Total Messages</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="newCount">-</div>
                <div class="stat-label">New (Unresponded)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="resolvedCount">-</div>
                <div class="stat-label">Resolved</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="feedbackCount">-</div>
                <div class="stat-label">Feedback</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="inquiryCount">-</div>
                <div class="stat-label">Inquiries</div>
            </div>
        </div>

        <div class="filter-tabs">
            <button class="filter-btn active" data-filter="all">All Messages</button>
            <button class="filter-btn" data-filter="unresponded">Unresponded</button>
            <button class="filter-btn" data-filter="responded">Responded</button>
        </div>

        <div id="errorBanner" class="error-message hidden"></div>

        <div class="messages-list" id="messagesList">
            <div class="no-messages">Loading messages...</div>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
